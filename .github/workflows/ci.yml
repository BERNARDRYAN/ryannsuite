name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check exported pages exist
        run: |
          for f in index.html 404.html resume/index.html changelog/index.html sitemap.xml robots.txt _headers; do
            test -f "out/$f" || { echo "missing out/$f"; exit 1; }
          done
